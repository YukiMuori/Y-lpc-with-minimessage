name: Build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Gradle runs on Java 21 — that's also the compile target for the universal jar.
      # The jar is cross-compatible with Java 25 / Paper 26.2 at runtime (see crossCompatTest).
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build, test & cross-compat proof
        # `build` runs the normal (Adventure 4) tests; `crossCompatTest` re-runs the SAME
        # Adventure-4-compiled tests against an Adventure 5 runtime — proving the universal jar
        # loads and runs on Paper 26.2.
        run: ./gradlew clean build crossCompatTest --no-daemon --stacktrace

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: LPC-jar
          path: build/libs/LPC-*.jar
          retention-days: 7
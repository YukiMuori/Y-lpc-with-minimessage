plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.11'
}

group = 'de.ayont'
version = project.findProperty('project_version') ?: '5.0.0'

// Target: Paper/Leaf 26.2 on Java 25. Adventure comes from the server (paper-api), not shaded.
final def PAPER = '26.2.build.133-stable'
final def SQLITE_JDBC = '3.46.0.0'
final def TARGET_JAVA = 25
final def API_VERSION = '1.21'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${PAPER}"
    compileOnly "net.luckperms:api:$luckpermsapi"
    compileOnly "me.clip:placeholderapi:$papi"

    // SQLite JDBC — shaded so LPC can run on any server without depending on a server-bundled driver.
    implementation "org.xerial:sqlite-jdbc:${SQLITE_JDBC}"

    testImplementation "io.papermc.paper:paper-api:${PAPER}"
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

test {
    useJUnitPlatform()
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(TARGET_JAVA)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(TARGET_JAVA)
}

processResources {
    def props = [
            version       : version,
            apiVersion    : API_VERSION,
            buildTarget   : 'universal',
            buildMc       : '26.2',
            buildJava     : TARGET_JAVA,
            buildAdventure: 'server'
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['plugin.yml', 'lpc-build.properties']) {
        expand props
    }
}

shadowJar {
    archiveFileName.set("LPC-${project.version}.jar")
    mergeServiceFiles {
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
    }
}

jar {
    enabled = false
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

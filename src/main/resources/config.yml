# ┌─────────────────────────────────────────────────────────────────────┐
# │  LPC Chat Suite V5.1 — MiniMessage chat formatting + social suite   │
# │  See https://docs.advntr.dev/minimessage/ for MiniMessage syntax.   │
# └─────────────────────────────────────────────────────────────────────┘
#
# Set up LuckPerms meta first:
# https://luckperms.net/wiki/Prefixes,-Suffixes-&-Meta
#
# Placeholders usable in formats:
#   {message}         - the chat message (inserted safely, never re-parsed)
#   {name}            - the player's name
#   {displayname}     - the player's display name / nickname
#   {gradient-name}   - the player's name wrapped in their rank gradient (see gradient-names)
#   {world}           - the player's current world
#   {prefix}          - the highest priority prefix
#   {suffix}          - the highest priority suffix
#   {prefixes}        - all prefixes, highest priority first
#   {suffixes}        - all suffixes, highest priority first
#   {username-color}  - the 'username-color' LuckPerms meta value
#   {message-color}   - the 'message-color' LuckPerms meta value
#
# NOTE: Prefixes, suffixes and colors must use MiniMessage, not legacy (&a / §b) codes.
# PlaceholderAPI placeholders (%...%) are supported inside formats when PlaceholderAPI is installed.

# Main chat format.
chat-format: "{prefix}{name}<dark_gray> »<reset> {message}"

# Per-group formats (optional).
group-formats:
#  default: "<gray>[User]</gray> {name}<dark_gray> »<reset> {message}"
#  admin: "<red>[Admin]</red> {name}<dark_gray> »<reset> {message}"

# Per-track formats (optional). Group formats take priority over track formats.
track-formats:
#  staff_track: "<gold>[Staff]</gold> {name}<dark_gray> »<reset> {message}"
#  donator_track: "<aqua>[Donator]</aqua> {name}<dark_gray> »<reset> {message}"

# Show-item: [i] / [item] in chat → inline item sprite + hover tooltip (Paper 1.21.5+).
use-item-placeholder: true
item-show:
  enabled: true
  # Use Minecraft native item sprites (<font:minecraft:item><sprite:material>). Falls back
  # to text brackets when unavailable (Spigot or older Paper).
  sprite: true
  color: "<aqua>"
  bracket-color: "<gray>"

# Allow players with 'lpc.chatcolor' to use <gradient> and <rainbow> tags in their messages.
allow-gradient-tags: true

# Worlds in which LPC will NOT format chat.
disabled-worlds: []

# Check Modrinth for new versions on startup.
update-checker: true

# Message shown after running '/lpc reload'.
reload-message: "<green>Configurazione LPC ricaricata!"

# ─────────────────────────────────────────────────────────────────────────
#  Advanced player hover — tooltip + click-to-message on player names.
# ─────────────────────────────────────────────────────────────────────────
player-hover:
  enabled: true
  click-to-message: true
  lines:
    - "<gradient:#FED83D:#BE2086>{name}</gradient>"
    - "<gray>Rank: <white>{prefix}</white>"
    - "<gray>World: <white>{world}</white>"
    - ""
    - "<yellow>Click to message"

# ─────────────────────────────────────────────────────────────────────────
#  @Mention pings — highlight player names, ping sound + action bar.
# ─────────────────────────────────────────────────────────────────────────
mentions:
  enabled: true
  require-at-symbol: false
  highlight-format: "<gold>@<name></gold>"
  max-mentions-per-message: 5
  actionbar-text: "<gold>✦ <white>Sei stato menzionato da <yellow><sender></yellow>"
  ping-sound: "entity.experience_orb.pickup"
  ping-volume: 1.0
  ping-pitch: 1.0

  staff:
    enabled: true
    permission: "lpc.staffchat"

  everyone:
    enabled: true
    permission: "lpc.mention.everyone"
    bypass-permission: "lpc.mention.everyone.bypass"
    cooldown: 60
    max-per-message: 1

# ─────────────────────────────────────────────────────────────────────────
#  Notifications — sound/actionbar/title/bossbar per event.
#  Each notification supports any combination of: sound, chat, actionbar, title, bossbar.
# ─────────────────────────────────────────────────────────────────────────
notifications:
  enabled: true
  private-message:
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.0
    actionbar: "<gold>✉ <white>Nuovo messaggio da <yellow>{sender}</yellow>"
  mention:
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.2
    actionbar: "<gold>✦ <white>Sei stato menzionato da <yellow>{sender}</yellow>"
  everyone:
    sound: "entity.player.levelup"
    volume: 1.0
    pitch: 1.0
    actionbar: "<gradient:#FED83D:#BE2086>✦ @everyone</gradient>"
  staff:
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 0.8
    actionbar: "<gradient:#FED83D:#BE2086>✦ @staff</gradient>"
  staff-chat:
    sound: "entity.experience_orb.pickup"
    volume: 0.8
    pitch: 0.6
    actionbar: "<gradient:#FED83D:#BE2086>✦ Staff chat</gradient>"

  # System alerts (slowmode, mute cooldown, errors). Bossbar = barra in alto.
  # Placeholder {text} = testo dell'errore.
  system.alert:
    chat: "<red>{text}</red>"
    actionbar: "<red>{text}</red>"
    bossbar:
      enabled: true
      text: "<red>{text}</red>"
      color: "red"
      overlay: "progress"
      seconds: 2

  # Placeholder {seconds} = secondi da attendere.
  slowmode:
    sound: ""
    chat: ""
    actionbar: "<red>Scrivi più lentamente <yellow>({seconds}s)</yellow>"
    bossbar:
      enabled: true
      text: "<red>⏳ Attendi <yellow>{seconds}s</yellow> prima di scrivere"
      color: "red"
      overlay: "progress"
      progress: 1.0
      seconds: 2

# ─────────────────────────────────────────────────────────────────────────
#  Emoji / shortcut replacement.
# ─────────────────────────────────────────────────────────────────────────
emoji:
  enabled: true
  require-permission: false
  replacements:
    ":heart:": "❤"
    ":star:": "★"
    ":check:": "✔"
    ":cross:": "✖"
    ":arrow:": "➜"
    ":note:": "♪"

# ─────────────────────────────────────────────────────────────────────────
#  Glyphs (Nexo integration) — :alias: → <glyph:name>.
# ─────────────────────────────────────────────────────────────────────────
glyphs:
  enabled: true
  require-permission: false
  replacements: {}
  registry:
    heart:
      aliases:
        - ":cuore:"
        - ":heart:"
      fallback: "❤"
    star:
      aliases:
        - ":stella:"
        - ":star:"
      fallback: "★"

# ─────────────────────────────────────────────────────────────────────────
#  URL linkification.
# ─────────────────────────────────────────────────────────────────────────
link-urls:
  enabled: true
  style: "<blue><underlined>"
  hover-text: "<gray>Apri link"
  allowed-schemes:
    - http
    - https
  max-length: 200

# ─────────────────────────────────────────────────────────────────────────
#  Per-rank message styling.
# ─────────────────────────────────────────────────────────────────────────
message-styles:
  enabled: false
group-message-styles:
#  admin: "<red>{message}</red>"
track-message-styles:
#  staff_track: "<aqua>{message}</aqua>"
default-message-style: ""

# ─────────────────────────────────────────────────────────────────────────
#  Gradient names.
# ─────────────────────────────────────────────────────────────────────────
gradient-names:
  enabled: false
  default-meta-key: "username-gradient"
group-name-gradients:
#  admin: "#FF5555:#FFAA00"

# ─────────────────────────────────────────────────────────────────────────
#  Join / Quit / Death messages.
#  - `per-group`: attiva formati e sound personalizzati per gruppo/track.
#  - `sound`: suono riprodotto al player che entra.
#  - `groups.<group>.format` sovrascrive il formato per quel gruppo.
#  - `tracks.<track>.format` formato per tutti i gruppi nel track.
# ─────────────────────────────────────────────────────────────────────────
join-messages:
  enabled: false
  per-group: false
  format: "<dark_gray>[<green>+</green>] {prefix}{name}"
  sound: "entity.player.levelup"
  sound-volume: 0.6
  sound-pitch: 1.2
  first-join:
    enabled: false
    format: "<gradient:#B754F4:#FC00FF>Welcome {name} to the server!</gradient>"
    sound: "ui.toast.challenge_complete"
    sound-volume: 1.0
    sound-pitch: 1.0
  groups: {}
    # admin:
    #   format: "<dark_gray>[<red>+</red>] <red>{prefix}{name}"
    #   sound: "entity.player.levelup"
  tracks: {}
quit-messages:
  enabled: false
  format: "<dark_gray>[<red>-</red>] {prefix}{name}"
  groups: {}
  tracks: {}
death-messages:
  enabled: false
  format: "<gray>☠ <death-message>"
  show-vanilla-cause: true

# ─────────────────────────────────────────────────────────────────────────
#  Moderation.
# ─────────────────────────────────────────────────────────────────────────
moderation:
  enabled: false

anti-spam:
  enabled: true
  cooldown-millis: 1500
  message: "<red>Attendi <yellow>{seconds}s</yellow> prima di scrivere."

repeat-filter:
  enabled: true
  expiry-millis: 30000
  message: "<red>Non ripetere lo stesso messaggio."

caps-filter:
  enabled: true
  min-length: 8
  max-uppercase-ratio: 0.7
  action: LOWERCASE
  message: "<red>Non scrivere in maiuscolo."

profanity-filter:
  enabled: false
  action: MASK
  words: []
  mask-char: "*"
  message: "<red>Language."

anti-advert:
  enabled: false
  action: REDACT
  detect-ip: true
  allowlist: []
  mask: "[link removed]"
  message: "<red>Non pubblicizzare link."

# ─────────────────────────────────────────────────────────────────────────
#  Mute.
# ─────────────────────────────────────────────────────────────────────────
mute:
  enabled: false
  enable-commands: true
  permission-node: "lpc.muted"
  message: "<red>Sei mutato."

# ─────────────────────────────────────────────────────────────────────────
#  Private messages (/msg, /w, /tell, /r).
# ─────────────────────────────────────────────────────────────────────────
private-messages:
  enabled: true
  format-sender: "<gray>[<gold>Tu</gold> <gold>→</gold> <white>{receiver}</white>]</gray> <white>{message}"
  format-receiver: "<gray>[<white>{sender}</white> <gold>→</gold> <gold>Tu</gold>]</gray> <white>{message}"
  no-reply: "<red>Nessuno a cui rispondere."
  player-not-found: "<red>Giocatore non trovato."
  player-offline: "<red>{name} non è online."
  ignored: "<red>Non puoi messaggiare quel giocatore."
  disabled: "<red>Quel giocatore ha i messaggi privati disattivati."

# ─────────────────────────────────────────────────────────────────────────
#  PM Inbox — salva PM non letti, remind periodico e a join/ritorno AFK.
#  Tutti i messaggi sono personalizzabili con MiniMessage.
#  Placeholders: <count> (numero messaggi), <plurale_i_o> ("o" per 1, "i" per N).
#  commandi: /inbox, /messaggi, /mail, /lpc inbox.
# ─────────────────────────────────────────────────────────────────────────
pm-inbox:
  enabled: true
  remind-delay-seconds: 30
  remind-interval-seconds: 60
  remind-on-afk-return: true
  max-per-player: 50
  join-reminder: "<dark_gray>[<gradient:#B754F4:#FC00FF>LPC</gradient>] <yellow>Hai <white><count></white> PM non lett<plurale_i_o>. Usa <white>/inbox</white>."
  remind-message: "<dark_gray>[<gradient:#B754F4:#FC00FF>LPC</gradient>] <yellow>Hai <white><count></white> PM non lett<plurale_i_o>. <white>/inbox</white>"
  empty-message: "<dark_gray>[<gradient:#B754F4:#FC00FF>LPC</gradient>] <yellow>Non hai messaggi non letti."
  header: "<dark_gray>[<gradient:#B754F4:#FC00FF>LPC</gradient>] <yellow>Messaggi non letti <gray>(<count>):"
  line-format: "<dark_gray>- <white><from></white> <gray>(<ago>): <white><msg>"

# ─────────────────────────────────────────────────────────────────────────
#  Ignore system.
# ─────────────────────────────────────────────────────────────────────────
ignore:
  enabled: true
  bypass-permission: "lpc.ignore.bypass"
  blocks:
    chat: true
    private-messages: true
    mentions: true
    notifications: true

# ─────────────────────────────────────────────────────────────────────────
#  Social spy (/socialspy).
# ─────────────────────────────────────────────────────────────────────────
social-spy:
  enabled: true
  format: "<dark_gray>[SocialSpy]</dark_gray> <gray>{sender} <dark_gray>→</dark_gray> {receiver}: <white>{message}</white>"

# ─────────────────────────────────────────────────────────────────────────
#  Staff chat (/sc).
# ─────────────────────────────────────────────────────────────────────────
staff-chat:
  enabled: true
  format: "<gradient:#FED83D:#BE2086>STAFF</gradient> <gray>{name} <dark_gray>»</dark_gray> <white>{message}</white>"

# ─────────────────────────────────────────────────────────────────────────
#  Slow mode.
# ─────────────────────────────────────────────────────────────────────────
slow-mode:
  enabled: true
  default-seconds: 0

# ─────────────────────────────────────────────────────────────────────────
#  Clear chat (/clearchat, /cc).
# ─────────────────────────────────────────────────────────────────────────
clear-chat:
  enabled: true
  lines: 100
  message: "<gray>La chat è stata pulita da uno staffer."

# ─────────────────────────────────────────────────────────────────────────
#  Statistics (SQLite async).
# ─────────────────────────────────────────────────────────────────────────
statistics:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────
#  Discord integration.
# ─────────────────────────────────────────────────────────────────────────
discord:
  enabled: false
  bot:
    enabled: false
    token: "${LPC_DISCORD_TOKEN}"
    guild-id: ""
  channels:
    global: ""
    staff: ""
  minecraft-to-discord: true
  discord-to-minecraft: true

# ─────────────────────────────────────────────────────────────────────────
#  Annunci manuali (/announce, /annuncio, /broadcast).
# ─────────────────────────────────────────────────────────────────────────
announcements:
  manual-prefix: "<dark_gray>[<gold>Annuncio</gold>]</dark_gray> "
  manual-bossbar:
    color: "yellow"
    overlay: "progress"
    seconds: 5

# ─────────────────────────────────────────────────────────────────────────
#  ChatGames: giochi automatici in chat (solo Paper).
#  Tipi: math (calcolo veloce), scramble (parola anagrammata), type (scrivi per primo),
#        number (indovina il numero), trivia, complete (completa la parola).
#  Comandi: /chatgames [start [tipo]|stop|reload|toggle|top]  (admin: lpc.chatgames.admin)
#  Placeholder: %lpc_chatgames_wins%
# ─────────────────────────────────────────────────────────────────────────
chat-games:
  enabled: true
  interval-minutes: 10
  min-players: 3
  duration-seconds: 60
  # Dopo una vittoria il giocatore non può vincere di nuovo per X minuti (anti-farming).
  win-cooldown-minutes: 15
  types: [math, scramble, type, number, trivia, complete]
  sounds:
    start: "block.note_block.pling"
    win: "entity.player.levelup"
  math:
    max-add: 500
    max-mul: 15
  number:
    max: 100
  complete:
    hide-ratio: 0.4
  # Premi: per ogni voce si tira "chance" (percentuale) in modo indipendente.
  # "rewards.<tipo>" sostituisce "rewards.default" per quel tipo. {player} = vincitore.
  rewards:
    default:
      - chance: 100
        commands: ["cmi money give {player} 150"]
        text: "<#FED83D>150 monete"
      - chance: 3
        commands: ["bugheuri give {player} 3 -s"]
        text: "<#FED83D>3 bugheuri"
      - chance: 1
        commands: ["crates giveKey diamante {player} 1 -s"]
        text: "<gradient:#BE2086:#FED83D>Chiave Diamante</gradient>"
    type:
      - chance: 100
        commands: ["cmi money give {player} 100"]
        text: "<#FED83D>100 monete"
      - chance: 2
        commands: ["bugheuri give {player} 3 -s"]
        text: "<#FED83D>3 bugheuri"
    number:
      - chance: 100
        commands: ["cmi money give {player} 200"]
        text: "<#FED83D>200 monete"
      - chance: 3
        commands: ["bugheuri give {player} 3 -s"]
        text: "<#FED83D>3 bugheuri"
      - chance: 1
        commands: ["crates giveKey diamante {player} 1 -s"]
        text: "<gradient:#BE2086:#FED83D>Chiave Diamante</gradient>"
  # Parole per "scramble" e "complete" (una parola sola, senza spazi).
  words: [creeper, diamante, smeraldo, piccone, netherite, enderman, lanterna, portale, villaggio, incantesimo,
    pozione, ossidiana, redstone, scheletro, zombie, forziere, fornace, tridente, elitre, totem,
    ghast, blaze, shulker, warden, axolotl, ametista, mangrovia, ciliegio, lucciola, sniffer,
    neverland, peluche, bugheuri, pescatore, scudo, falò, cristallo, conchiglia, girasole, arcobaleno]
  # Frasi per "type" (scrivi per primo).
  phrases: ["Benvenuti a Neverland", "Il creeper è dietro di te", "Viva DaveToy95", "Diamanti a mezzanotte",
    "Pesca miracolosa", "Torta al cioccolato", "Il drago dell'End", "Scava dritto mai", "Neverland per sempre",
    "Un piccone di netherite", "Lucciole nella notte", "Zuppa di funghi calda"]
  # Trivia: più risposte accettate; maiuscole e accenti ignorati.
  trivia:
    - question: "Quanti blocchi di ossidiana servono come minimo per un portale del Nether?"
      answers: ["10", "dieci"]
    - question: "Quale mob esplode quando ti si avvicina?"
      answers: ["creeper", "il creeper"]
    - question: "Con quale oggetto si addomestica un lupo?"
      answers: ["osso", "un osso", "ossa"]
    - question: "Qual è il minerale più resistente del gioco?"
      answers: ["netherite"]
    - question: "Come si chiama il boss finale dell'End?"
      answers: ["ender dragon", "drago", "drago dell'end", "enderdrago"]
    - question: "Quale materiale serve per craftare un tavolo da incantamento oltre a diamanti e libro?"
      answers: ["ossidiana"]
    - question: "Quale mob lascia cadere le perle dell'Ender?"
      answers: ["enderman"]
    - question: "Quante lane servono per fare un letto?"
      answers: ["3", "tre"]
    - question: "In quale dimensione si trova la fortezza del Nether?"
      answers: ["nether", "il nether"]
    - question: "Quale animale dà il latte oltre alla mucca?"
      answers: ["capra", "la capra", "mooshroom"]
    - question: "Che cosa mangia il panda?"
      answers: ["bambu", "bambù"]
    - question: "Quale mob vive nell'Antica Città e non vede?"
      answers: ["warden", "il warden"]
    - question: "Quale oggetto ti salva dalla morte se lo tieni in mano?"
      answers: ["totem", "totem dell'immortalità", "totem of undying"]
    - question: "Chi è lo streamer di Neverland?"
      answers: ["davetoy95", "dave", "davetoy"]
  messages:
    prefix: "<gradient:#BE2086:#FED83D>ChatGames</gradient> <dark_gray>»</dark_gray> "
    start:
      math: "<prefix><#CCCCCC>Calcolo veloce! <hover:show_text:'<#9C9C9C>Scrivi il risultato in chat<newline><#9C9C9C>Tempo: <white><seconds>s'><#FED83D>Quanto fa <white><question></white>?</hover>"
      scramble: "<prefix><#CCCCCC>Riordina le lettere: <hover:show_text:'<#9C9C9C>Inizia con <white><hint><newline><#9C9C9C>Tempo: <white><seconds>s'><#FED83D><question></hover>"
      type: "<prefix><#CCCCCC>Scrivi per primo: <hover:show_text:'<#9C9C9C>Scrivila in chat, maiuscole e accenti non contano<newline><#9C9C9C>Tempo: <white><seconds>s'><#FED83D><question></hover>"
      number: "<prefix><#CCCCCC>Indovina il numero tra <#FED83D><question></#FED83D>! <hover:show_text:'<#9C9C9C>Scrivi un numero: ti dirò se è più alto o più basso<newline><#9C9C9C>Tempo: <white><seconds>s'><dark_gray>[?]</dark_gray></hover>"
      trivia: "<prefix><#CCCCCC>Trivia: <hover:show_text:'<#9C9C9C>Rispondi in chat<newline><#9C9C9C>Tempo: <white><seconds>s'><#FED83D><question></hover>"
      complete: "<prefix><#CCCCCC>Completa la parola: <hover:show_text:'<#9C9C9C>Scrivi la parola intera<newline><#9C9C9C>Tempo: <white><seconds>s'><#FED83D><question></hover>"
    win: "<prefix><#7EE2A8><player></#7EE2A8> <#CCCCCC>ha vinto in <#FED83D><time>s</#FED83D>! <dark_gray>→</dark_gray> <hover:show_text:'<#9C9C9C>Vittorie totali: <white><wins>'><white><answer></white></hover> <dark_gray>┃</dark_gray> <rewards>"
    timeout: "<prefix><#FF5C7A>Tempo scaduto! <#CCCCCC>La risposta era <white><answer></white>."
    stopped: "<prefix><#FF5C7A>Gioco annullato. <#CCCCCC>La risposta era <white><answer></white>."
    number-higher: "<prefix><#CCCCCC><white><guess></white> <dark_gray>→</dark_gray> <#7EE2A8>più alto ▲"
    number-lower: "<prefix><#CCCCCC><white><guess></white> <dark_gray>→</dark_gray> <#FF5C7A>più basso ▼"
    cooldown: "<prefix><#FF5C7A>Hai vinto da poco: riprova tra <white><minutes></white> min."
    toggle-on: "<prefix><#7EE2A8>ChatGames attivati."
    toggle-off: "<prefix><#FF5C7A>ChatGames disattivati. <#9C9C9C>/chatgames toggle per riattivarli."
    already-running: "<prefix><#FF5C7A>C'è già un gioco in corso."
    no-game: "<prefix><#FF5C7A>Nessun gioco in corso."
    unknown-type: "<prefix><#FF5C7A>Tipo sconosciuto. <#9C9C9C>Tipi: <white><types>"
    reloaded: "<prefix><#7EE2A8>Configurazione ricaricata."
    no-permission: "<prefix><#FF5C7A>Non hai il permesso."
    top-header: "<prefix><#CCCCCC>Classifica vittorie"
    top-line: "<dark_gray>  <pos>.</dark_gray> <white><player></white> <dark_gray>→</dark_gray> <#FED83D><wins>"
    top-empty: "<prefix><#9C9C9C>Ancora nessuna vittoria."
    help: "<prefix><#CCCCCC>Le tue vittorie: <#FED83D><wins></#FED83D> <dark_gray>┃</dark_gray> <#9C9C9C><click:run_command:'/chatgames top'><hover:show_text:'<#9C9C9C>Apri la classifica'>/chatgames top</hover></click> <dark_gray>·</dark_gray> <click:run_command:'/chatgames toggle'><hover:show_text:'<#9C9C9C>Attiva/disattiva i giochi'>/chatgames toggle</hover></click>"

config-version: 6

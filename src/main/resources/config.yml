# ┌─────────────────────────────────────────────────────────────────────┐
# │  LPC Chat Suite V5 — MiniMessage chat formatting + social features   │
# │  See https://docs.advntr.dev/minimessage/ for MiniMessage syntax.   │
# └─────────────────────────────────────────────────────────────────────┘
#
# Set up LuckPerms meta first:
# https://luckperms.net/wiki/Prefixes,-Suffixes-&-Meta
#
# Placeholders usable in formats:
#   {message}         - the chat message (inserted safely, never re-parsed)
#   {name}            - the player's name
#   {displayname}     - the player's display name / nickname
#   {gradient-name}   - the player's name wrapped in their rank gradient (see gradient-names)
#   {world}           - the player's current world
#   {prefix}          - the highest priority prefix
#   {suffix}          - the highest priority suffix
#   {prefixes}        - all prefixes, highest priority first
#   {suffixes}        - all suffixes, highest priority first
#   {username-color}  - the 'username-color' LuckPerms meta value
#   {message-color}   - the 'message-color' LuckPerms meta value
#
# NOTE: Prefixes, suffixes and colors must use MiniMessage, not legacy (&a / §b) codes.
# PlaceholderAPI placeholders (%...%) are supported inside formats when PlaceholderAPI is installed.

# Main chat format.
chat-format: "{prefix}{name}<dark_gray> »<reset> {message}"

# Per-group formats (optional). Remove the leading '#' to enable.
group-formats:
#  default: "<gray>[User]</gray> {name}<dark_gray> »<reset> {message}"
#  admin: "<red>[Admin]</red> {name}<dark_gray> »<reset> {message}"

# Per-track formats (optional). Group formats take priority over track formats.
track-formats:
#  staff_track: "<gold>[Staff]</gold> {name}<dark_gray> »<reset> {message}"
#  donator_track: "<aqua>[Donator]</aqua> {name}<dark_gray> »<reset> {message}"

# Enable the [item] placeholder (shows the held item, with a hover tooltip on Paper).
use-item-placeholder: true

# Allow players with 'lpc.chatcolor' to use <gradient> and <rainbow> tags in their messages.
allow-gradient-tags: true

# Worlds in which LPC will NOT format chat.
disabled-worlds: []

# Check Modrinth for new versions on startup.
update-checker: true

# Message shown after running '/lpc reload'.
reload-message: "<green>Reloaded LPC Chat Suite configuration!"

# ─────────────────────────────────────────────────────────────────────────
#  Advanced player hover — hover tooltip + click-to-message on player names.
# ─────────────────────────────────────────────────────────────────────────
player-hover:
  enabled: true
  click-to-message: true
  lines:
    - "<gradient:#FED83D:#BE2086>{name}</gradient>"
    - "<gray>Rank: <white>{prefix}</white>"
    - "<gray>World: <white>{world}</white>"
    - ""
    - "<yellow>Click to message"

# ─────────────────────────────────────────────────────────────────────────
#  @Mention pings — highlight player names, ping sound + action bar.
# ─────────────────────────────────────────────────────────────────────────
mentions:
  enabled: true
  require-at-symbol: false
  highlight-format: "<gold>@<name></gold>"
  max-mentions-per-message: 5
  actionbar-text: "<gold>✦ <white>You were mentioned by <yellow><sender></yellow>"
  ping-sound: "entity.experience_orb.pickup"
  ping-volume: 1.0
  ping-pitch: 1.0

  # @staff — alerts players with the configured permission.
  staff:
    enabled: true
    permission: "lpc.staffchat"

  # @everyone — protected by permission, per-player cooldown, and max count per message.
  everyone:
    enabled: true
    permission: "lpc.mention.everyone"
    bypass-permission: "lpc.mention.everyone.bypass"
    cooldown: 60
    max-per-message: 1

# ─────────────────────────────────────────────────────────────────────────
#  Notifications — sound + actionbar (and optionally title) on events.
# ─────────────────────────────────────────────────────────────────────────
notifications:
  enabled: true
  private-message:
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.0
    actionbar: "<gold>✉ <white>New message from <yellow>{sender}</yellow>"
  mention:
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 1.2
    actionbar: "<gold>✦ <white>You were mentioned by <yellow>{sender}</yellow>"
  everyone:
    sound: "entity.player.levelup"
    volume: 1.0
    pitch: 1.0
    actionbar: "<gradient:#FED83D:#BE2086>✦ @everyone</gradient>"
  staff:
    sound: "entity.experience_orb.pickup"
    volume: 1.0
    pitch: 0.8
    actionbar: "<gradient:#FED83D:#BE2086>✦ @staff</gradient>"

# ─────────────────────────────────────────────────────────────────────────
#  Emoji / shortcut replacement — replace text shortcuts with glyphs.
# ─────────────────────────────────────────────────────────────────────────
emoji:
  enabled: true
  require-permission: false
  replacements:
    ":heart:": "❤"
    ":star:": "★"
    ":check:": "✔"
    ":cross:": "✖"
    ":arrow:": "➜"
    ":note:": "♪"

# ─────────────────────────────────────────────────────────────────────────
#  Glyphs (Nexo integration) — :alias: → <glyph:name>. Falls back to literal
#  replacements when Nexo is not installed.
# ─────────────────────────────────────────────────────────────────────────
glyphs:
  enabled: true
  require-permission: false
  replacements: {}
  registry:
    heart:
      aliases:
        - ":cuore:"
        - ":heart:"
      fallback: "❤"
    star:
      aliases:
        - ":stella:"
        - ":star:"
      fallback: "★"

# ─────────────────────────────────────────────────────────────────────────
#  URL linkification.
# ─────────────────────────────────────────────────────────────────────────
link-urls:
  enabled: true
  style: "<blue><underlined>"
  hover-text: "<gray>Open link"
  allowed-schemes:
    - http
    - https
  max-length: 200

# ─────────────────────────────────────────────────────────────────────────
#  Per-rank message styling.
# ─────────────────────────────────────────────────────────────────────────
message-styles:
  enabled: false
group-message-styles:
#  admin: "<red>{message}</red>"
track-message-styles:
#  staff_track: "<aqua>{message}</aqua>"
default-message-style: ""

# ─────────────────────────────────────────────────────────────────────────
#  Gradient names.
# ─────────────────────────────────────────────────────────────────────────
gradient-names:
  enabled: false
  default-meta-key: "username-gradient"
group-name-gradients:
#  admin: "#FF5555:#FFAA00"

# ─────────────────────────────────────────────────────────────────────────
#  Join / Quit / Death messages.
# ─────────────────────────────────────────────────────────────────────────
join-messages:
  enabled: false
  format: "<dark_gray>[<green>+</green>] {prefix}{name}"
  first-join:
    enabled: false
    format: "<gradient:#B754F4:#FC00FF>Welcome {name} to the server!</gradient>"
quit-messages:
  enabled: false
  format: "<dark_gray>[<red>-</red>] {prefix}{name}"
death-messages:
  enabled: false
  format: "<gray>☠ <death-message>"
  show-vanilla-cause: true

# ─────────────────────────────────────────────────────────────────────────
#  Moderation.
# ─────────────────────────────────────────────────────────────────────────
moderation:
  enabled: false

anti-spam:
  enabled: true
  cooldown-millis: 1500
  message: "<red>Please wait <yellow><seconds>s</yellow> before chatting again."

repeat-filter:
  enabled: true
  expiry-millis: 30000
  message: "<red>Please don't repeat the same message."

caps-filter:
  enabled: true
  min-length: 8
  max-uppercase-ratio: 0.7
  action: LOWERCASE
  message: "<red>Please don't shout."

profanity-filter:
  enabled: false
  action: MASK
  words: []
  mask-char: "*"
  message: "<red>Watch your language."

anti-advert:
  enabled: false
  action: REDACT
  detect-ip: true
  allowlist: []
  mask: "[link removed]"
  message: "<red>Advertising is not allowed."

# ─────────────────────────────────────────────────────────────────────────
#  Mute.
# ─────────────────────────────────────────────────────────────────────────
mute:
  enabled: false
  enable-commands: true
  permission-node: "lpc.muted"
  message: "<red>You are currently muted."

# ─────────────────────────────────────────────────────────────────────────
#  Private messages (/msg, /w, /tell, /r).
# ─────────────────────────────────────────────────────────────────────────
private-messages:
  enabled: true
  format-sender: "<gray>[<gold>You</gold> <gold>→</gold> <white>{receiver}</white>]</gray> <white>{message}"
  format-receiver: "<gray>[<white>{sender}</white> <gold>→</gold> <gold>You</gold>]</gray> <white>{message}"
  no-reply: "<red>No player to reply to."
  player-not-found: "<red>Player not found."
  player-offline: "<red>{name} is not online."
  ignored: "<red>You cannot message that player."
  disabled: "<red>That player has private messages disabled."

# ─────────────────────────────────────────────────────────────────────────
#  Ignore system.
# ─────────────────────────────────────────────────────────────────────────
ignore:
  enabled: true
  bypass-permission: "lpc.ignore.bypass"
  blocks:
    chat: true
    private-messages: true
    mentions: true
    notifications: true

# ─────────────────────────────────────────────────────────────────────────
#  Social spy (/socialspy) — view other players' private messages.
# ─────────────────────────────────────────────────────────────────────────
social-spy:
  enabled: true
  format: "<dark_gray>[SocialSpy]</dark_gray> <gray>{sender} <dark_gray>→</dark_gray> {receiver}: <white>{message}</white>"

# ─────────────────────────────────────────────────────────────────────────
#  Staff chat (/staffchat, /sc).
# ─────────────────────────────────────────────────────────────────────────
staff-chat:
  enabled: true
  format: "<gradient:#FED83D:#BE2086>STAFF</gradient> <gray>{name} <dark_gray>»</dark_gray> <white>{message}</white>"

# ─────────────────────────────────────────────────────────────────────────
#  Slow mode — global chat cooldown.
# ─────────────────────────────────────────────────────────────────────────
slow-mode:
  enabled: true
  default-seconds: 0
  wait-message: "<red>Please wait <yellow>{seconds}s</yellow> before chatting again."

# ─────────────────────────────────────────────────────────────────────────
#  Clear chat (/clearchat, /cc).
# ─────────────────────────────────────────────────────────────────────────
clear-chat:
  enabled: true
  lines: 100
  message: "<gray>Chat was cleared by a staff member."

# ─────────────────────────────────────────────────────────────────────────
#  Statistics (SQLite, async, non-blocking).
# ─────────────────────────────────────────────────────────────────────────
statistics:
  enabled: true

# ─────────────────────────────────────────────────────────────────────────
#  Discord integration — disabled by default. Requires a companion bot
#  plugin registering a DiscordService implementation; LPC itself does not
#  bundle a Discord client. Token can be provided via ${LPC_DISCORD_TOKEN}
#  environment variable or a companion plugin's own config.
# ─────────────────────────────────────────────────────────────────────────
discord:
  enabled: false
  bot:
    enabled: false
    token: "${LPC_DISCORD_TOKEN}"
    guild-id: ""
  channels:
    global: ""
    staff: ""
  minecraft-to-discord: true
  discord-to-minecraft: true

# Internal config version. Do not edit.
config-version: 5
